# Docs-site workflow for an OpenSCAD repo: builds the site with the
# just-the-docs-template-openscad engine and deploys it to Pages from main.
# Copy to .github/workflows/docs.yml. See docs/openscad-repos.md.

name: Docs site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer pull-request run replaces an older one; a run on main is never
# cancelled, so a second push cannot stop a Pages deploy partway.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: site
        uses: CameronBrooks11/just-the-docs-template-openscad@v2
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.site.outputs.site-dir }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
