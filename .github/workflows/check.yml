# Runs the same gate as `just check` locally: every example must evaluate with no warnings.
name: Check

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install OpenSCAD and just
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad just

      - name: Show versions
        run: |
          openscad --version
          just --version

      - name: Check
        run: just check
